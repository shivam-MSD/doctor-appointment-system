<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background gradient & filters -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Modern clean backdrop card -->
  <rect width="90" height="90" x="5" y="5" rx="22" fill="#ffffff" filter="url(#shadow)" />

  <!-- Dynamic Sync/Heartbeat rings -->
  <path d="M 50,22 A 28,28 0 1,1 22,50" fill="none" stroke="url(#blueGrad)" stroke-width="6.5" stroke-linecap="round" />
  <path d="M 50,78 A 28,28 0 1,1 78,50" fill="none" stroke="url(#tealGrad)" stroke-width="6.5" stroke-linecap="round" />

  <!-- Center Medical Cross -->
  <rect x="46" y="38" width="8" height="24" rx="4" fill="url(#blueGrad)" />
  <rect x="38" y="46" width="24" height="8" rx="4" fill="url(#blueGrad)" />

  <!-- Connection Nodes -->
  <circle cx="22" cy="50" r="5" fill="#0284c7" />
  <circle cx="78" cy="50" r="5" fill="#14b8a6" />
</svg>
